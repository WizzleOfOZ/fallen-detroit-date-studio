function gddDatabase(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('This browser does not support IndexedDB.'));const req=indexedDB.open('fallen-detroit-gdd-source',1);req.onupgradeneeded=()=>req.result.createObjectStore('reference');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function setLocalGdd(text,meta){const database=await gddDatabase();await new Promise((resolve,reject)=>{const tx=database.transaction('reference','readwrite');tx.objectStore('reference').put({text,meta},'master');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});database.close();gddText=text;gddMeta=meta;render()}

function gddExcerptFor(name,limit=4200){if(!gddText)return '';const escaped=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp('^#{1,6}\\s+[^\\n]*'+escaped+'[^\\n]*','gmi');let match=re.exec(gddText);if(match){let a=match.index, next=gddText.slice(a+match[0].length).search(/\n#{1,5}\s/);let b=next>=0?a+match[0].length+next:gddText.length;return gddText.slice(a,Math.min(b,a+limit)).trim()}const at=gddText.toLowerCase().indexOf(name.toLowerCase());return at<0?'(District not found in imported document.)':gddText.slice(Math.max(0,at-200),at+limit).trim()}

function importArtFile(file){if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type))return toast('Choose a PNG, JPEG or WebP image.');if(file.size>15*1024*1024)return toast('Image file is too large. Use a file under 15 MB.');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1040/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.74);if(data.length>650000){const factor=Math.sqrt(650000/data.length),c=document.createElement('canvas');c.width=Math.max(1,Math.round(canvas.width*factor));c.height=Math.max(1,Math.round(canvas.height*factor));c.getContext('2d').drawImage(canvas,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',.60)}pendingArt=data;const preview=$('art-preview');if(preview){preview.classList.remove('hidd');preview.innerHTML=`<img src="${data}" alt="New artwork preview"><span class="fine muted">Image prepared for studio upload</span>`;}toast('Image prepared. Add a title and pin it.');};img.onerror=()=>toast('Could not read that image.');img.src=reader.result};reader.readAsDataURL(file)}

function handleAction(action,id,btnEl){if(action==='modal-close')return closeModal();if(action==='modal-settings'){closeModal();return nav('settings')}
 if(action==='start-date')return nav('music');if(action==='go-district')return nav('district');if(action==='go-gallery')return nav('gallery');if(action==='share')return inviteModal();
 if(action==='seat-phil'||action==='seat-kris'){const w=action==='seat-phil'?'Phil':'Kris';if(w!==who)swapSeat();return}if(action==='save-district')return saveDistrict();if(action==='propose-district'){const d=currDist();return propose(`${district}: ${d.name||'Untitled district concept'}`,['Atmosphere: '+(d.mood||''),'Opening: '+(d.first||''),'Fear: '+(d.fear||''),'Beauty: '+(d.beauty||''),'Exploration hook: '+(d.hook||''),'Phil: '+(d.phil||''),'Kris: '+(d.kris||'')].join('\n'),'District concept')}
 if(action==='ai-district'||action==='ai-room'||action==='ai-character'||action==='ai-story'){aiType=action.split('-')[1]==='room'?'room':action.split('-')[1];return nav('ai')}
 if(action==='room-add')return addRoom();if(action==='room-starter')return starterRooms();if(action==='room-select'){if(linkSource)return connectRooms(id);selectedRoom=id;return render()}
 if(action==='room-link'){if(linkSource&&linkSource!==id)return connectRooms(id);linkSource=linkSource===id?'':id;toast(linkSource?'Click Link on another room to connect them.':'Link mode cancelled.');return render()}
 if(action==='room-save')return saveRoom();if(action==='room-delete'){if(!state.rooms[selectedRoom]||!confirm('Delete this draft room and its links?'))return;const target=selectedRoom;delete state.rooms[target];commit('rooms',target);for(const r of Object.values(state.rooms)){if((r.links||[]).includes(target)){r.links=r.links.filter(x=>x!==target);commit('rooms',r.id)}}selectedRoom='';return render()}
 if(action==='propose-rooms'){const rs=getRooms();if(!rs.length)return toast('Create some rooms first.');return propose(district+': room-sequence concept',rs.map(r=>`${r.name} (${r.type})\nExperience: ${r.purpose||''}\nVisual: ${r.visual||''}\nEncounter: ${r.encounter||''}\nGate: ${r.gate||''}\nTwist: ${r.twist||''}\nLinked to: ${(r.links||[]).map(id=>state.rooms[id]?.name).join(', ')}`).join('\n\n'),'Room sequence')}
 if(action==='char-save')return saveChar();if(action==='char-new'){selectedChar='';return render()}if(action==='char-select'){selectedChar=id;return render()}if(action==='char-delete'){if(selectedChar&&confirm('Delete this character concept?')){delete state.characters[selectedChar];commit('characters',selectedChar);selectedChar='';render()}return}
 if(action==='art-open'){const a=state.gallery[id];if(a)return openModal(H(a.title),`<img alt="${H(a.title)}" src="${H(a.data)}" style="width:100%;max-height:65vh;object-fit:contain;border-radius:8px"><p class="muted fine">${H(a.notes)}</p>`)}if(action==='art-prompt')return copy('Analyze this reference as concept art for Angels of Anarchy: Fallen Detroit, a 2D side-view horror Metroidvania. Separate foreground, walkable plane, midground, background, architecture, light direction, color palette, reusable props, collision-readability and level-design affordances. Distinguish observations from suggestions; do not assume any idea is existing GDD canon.');if(action==='art-save')return artSave();if(action==='art-delete'){if(!state.gallery[id]||!confirm('Remove this concept image?'))return;delete state.gallery[id];commit('gallery',id);return render()}if(action==='art-propose'){const art=state.gallery[id];if(art)return propose('Visual: '+art.title,'District: '+art.district+'\nVisual design notes: '+art.notes+'\nArt reference in the Two Souls Studio Gallery.','Visual concept')}
 if(action==='story-add')return storyAdd();if(action==='story-twist'){let last=prompts.indexOf(state.notes.storyPrompt);let next=(last+1+Math.floor(Math.random()*(prompts.length-1)))%prompts.length;state.notes.storyPrompt=prompts[next];commit('notes');return render()}
 if(action==='propose-story'){const beats=arr(state.story);return propose('Our darkest story',beats.map(s=>s.author+': '+s.text).join('\n\n'),'Story')}
 if(action==='music-reveal'){state.notes.revealedTracks=state.notes.revealedTracks||{};state.notes.revealedTracks[musicCat]=true;commit('notes');toast('Both songs in this category are now revealed.');return render()}if(action==='music-add')return musicAdd();if(action==='music-delete'){delete state.tracks[id];commit('tracks',id);return render()}
 if(action==='ai-copy')return copy(promptFor(aiType));if(action==='ai-download')return download('fallen-detroit-'+aiType+'-ai-prompt.txt',promptFor(aiType));if(action==='ai-save'||action==='ai-propose'){const seat=btnEl.dataset.seat;let text=val('ai-result-'+seat);if(action==='ai-save')return aiSave(seat);if(!text)return toast('Paste an AI response first.');state.ai[seat]={engine:val('ai-engine-'+seat)||'My AI',result:text,type:aiType,updated:Date.now()};commit('ai',seat);return propose(`${seat}'s AI: ${AI_TYPES.find(x=>x[0]===aiType)?.[1||0]||aiType}`,text,'AI concept',seat)}
 if(action==='vault-add'){const title=val('vault-title'),body=val('vault-body');if(!body)return toast('Describe your idea first.');propose(title,body);return render()}if(action==='vault-vote'){const p=state.proposals[id];if(!p)return;p.votes=p.votes||{};p.votes[who]=!p.votes[who];commit('proposals',id);toast(p.votes.Phil&&p.votes.Kris?'Both partners approved this concept.':'Vote updated.');return render()}if(action==='vault-copy'){const p=state.proposals[id];if(p)return copy(p.title+'\n\n'+p.body)}
 if(action==='gdd-remove'){if(confirm('Remove the locally stored master GDD reference? Your shared studio designs will remain untouched.'))removeLocalGdd().catch(e=>toast(e.message));return}
 if(action==='export-json'||action==='export-md')return exportContent(action==='export-json'?'json':'md');if(action==='reset-all'){if(!confirm('Reset every local concept, room, character, story, music track and vote? Export a backup first.'))return;if(cloud&&!confirm('You are connected to a shared room. This reset will also replace the shared data for BOTH people. Continue?'))return;state=fresh();save();if(cloud)fb.set(fb.ref(db,'rooms/'+roomToken),state).catch(e=>toast(e.message));toast('Studio reset.');return render()}
 if(action==='cloud-create'){(async()=>{try{const config=getConfig(),token=generateToken();await connectRoom(config,token,true);toast('Room created. Copy the invite link to Kris.')}catch(e){toast(e.message)}})();return}
 if(action==='cloud-join')return openModal('Join your shared studio',`<p class="lead">Paste an invite link generated on the other person's PC. This joins the same room and loads the shared work.</p>${area('Session invite URL','join-url','','Paste full URL here...',4)}<div class="spacer"></div>${btn('Join this room','join-submit','btn-accent btn-wide')}`);
 if(action==='join-submit'){(async()=>{try{const info=parseInvite(val('join-url'));await connectRoom(info.config,info.room,false);closeModal();toast('Joined the room. Select your own seat at the top.')}catch(e){toast(e.message)}})();return}
 if(action==='cloud-copy')return copy(buildInvite());
}

document.addEventListener('click',e=>{const navEl=e.target.closest('[data-view]');if(navEl){e.preventDefault();return nav(navEl.dataset.view)}const col=e.target.closest('[data-color]');if(col){document.querySelectorAll('[data-color]').forEach(x=>x.classList.remove('selected'));col.classList.add('selected');$('district-color').value=col.dataset.color;return}const aiTab=e.target.closest('[data-ai-type]');if(aiTab){aiType=aiTab.dataset.aiType;return render()}const musicTab=e.target.closest('[data-music-cat]');if(musicTab){musicCat=Number(musicTab.dataset.musicCat);return render()}const act=e.target.closest('[data-action]');if(act){e.preventDefault();handleAction(act.dataset.action,act.dataset.id,act)}});
document.addEventListener('change',e=>{if(e.target.id==='gdd-source-file'){const file=e.target.files?.[0];if(!file)return;if(file.size>30*1024*1024)return toast('GDD file exceeds the 30 MB import limit.');if(!/\.(md|txt|html)$/i.test(file.name))return toast('Use the editable .md, .txt or .html GDD instead of PDF.');(async()=>{try{const text=await file.text();if(!text.trim())throw Error('The chosen document is empty.');const meta={name:file.name,size:(file.size/1024/1024).toFixed(2)+' MB',imported:new Date().toLocaleString()};await setLocalGdd(text,meta);toast('Master GDD loaded on this PC. AI prompts now include local excerpts.')}catch(err){toast('Import failed: '+err.message)}})();return}if(e.target.id==='art-file')return importArtFile(e.target.files?.[0]);if(e.target.id==='district-picker'){district=e.target.value;localStorage.setItem('fallen_detroit_district',district);selectedRoom='';return render()}if(e.target.matches('[data-act]')){const id=e.target.dataset.act;state.activities[id]=e.target.checked;commit('activities',id);return render()}if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const json=JSON.parse(reader.result);if(json.app!=='Fallen Detroit Two Souls Studio'||!json.data||!json.data.rooms||!json.data.proposals)throw Error('This file is not a valid studio backup.');if(!confirm('Replace the current studio data with this backup?'))return;if(cloud&&!confirm('This will replace the current shared session for both PCs. Continue?'))return;state=Object.assign(fresh(),json.data);save();if(cloud)fb.set(fb.ref(db,'rooms/'+roomToken),state).catch(e=>toast(e.message));toast('Backup loaded.');render()}catch(e){toast('Import failed: '+e.message)}};reader.readAsText(file)}});
document.addEventListener('focusin',e=>{if(e.target.matches('#view-root input:not([type=checkbox]),#view-root textarea,#view-root select'))editLock=true});
document.addEventListener('focusout',e=>{if(e.target.matches('#view-root input:not([type=checkbox]),#view-root textarea,#view-root select'))editLock=false});
$('mobile-menu').addEventListener('click',()=>$('sidebar').classList.toggle('show'));
$('identity-button').addEventListener('click',swapSeat);
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('storage',e=>{if(e.key===LS&&!cloud){try{state=Object.assign(fresh(),JSON.parse(e.newValue||'{}'));if(!editLock)render()}catch{}}});
$('persona-name').textContent=who;$('identity-button').querySelector('.persona-orb').textContent=who[0];$('identity-button').classList.toggle('kris',who==='Kris');setStatus(false);render();restoreLocalGdd();
if(location.hash.startsWith('#join=')){(async()=>{try{const info=parseInvite(location.hash);await connectRoom(info.config,info.room,false);if(!sessionStorage.getItem('fallen-joined-'+info.room)){sessionStorage.setItem('fallen-joined-'+info.room,'1');openModal('Welcome to your shared world',`<p class="lead">You are connected to the shared studio. Select who is working on this PC.</p><div class="two-people"><button class="person-card" data-action="seat-phil"><div class="person-name">Phil</div></button><button class="person-card kris" data-action="seat-kris"><div class="person-name">Kris</div></button></div><div class="spacer"></div>${btn('Enter the studio','modal-close','btn-accent btn-wide')}`)}}catch(e){toast('Could not join shared room: '+e.message)}})()}

</script>
</body></html>
